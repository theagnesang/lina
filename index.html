<!DOCTYPE html>

  <title>Agnes — LinkedIn Draft Preview</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">

      <div class="topbar-brand">
        <span class="brand-mark">in</span>
        <span class="brand-name">Draft Preview</span>

  </footer>
